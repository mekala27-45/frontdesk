services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: frontdesk
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk"]
      interval: 2s
      retries: 20

