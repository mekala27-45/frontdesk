name: Reminder dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  send:
    if: vars.ENABLE_REMINDERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/trigger_reminders.py
        env:
          FRONTDESK_API_URL: ${{ secrets.FRONTDESK_API_URL }}
          REMINDER_SECRET: ${{ secrets.REMINDER_SECRET }}

