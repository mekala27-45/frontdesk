[project]
name = "frontdesk"
version = "0.1.0"
description = "Fictional clinic logistics with durable, auditable tools"
requires-python = ">=3.12,<3.13"
dependencies = ["frontdesk-core", "frontdesk-scheduling", "frontdesk-whatsapp", "frontdesk-agent", "frontdesk-calendar", "frontdesk-api"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
frontdesk-core = { workspace = true }
frontdesk-scheduling = { workspace = true }
frontdesk-whatsapp = { workspace = true }
frontdesk-agent = { workspace = true }
frontdesk-calendar = { workspace = true }
frontdesk-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "hypothesis", "testcontainers[postgres]", "ruff", "mypy", "types-requests", "pillow"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["packages"]
explicit_package_bases = true
mypy_path = ["packages/core/src", "packages/scheduling/src", "packages/whatsapp/src", "packages/agent/src", "packages/calendar/src", "packages/api/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["external: requires probed Docker and real Postgres"]

[tool.coverage.run]
source = ["frontdesk_core", "frontdesk_scheduling", "frontdesk_whatsapp", "frontdesk_agent", "frontdesk_calendar", "frontdesk_api"]
[tool.coverage.report]
fail_under = 80
show_missing = true

